[project]
name = "redis-guard-mcp"
version = "0.1.0"
description = "A Redis MCP server whose tool surface IS the allowlist — every tool maps to one safe read-only redis-py call, with no generic command-execution escape hatch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Berkant Acun" }]
keywords = ["mcp", "model-context-protocol", "redis", "security", "read-only"]
dependencies = [
    "mcp>=1.2.0",
    "redis>=5.0.0",
]

[project.scripts]
redis-guard-mcp = "redis_guard_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redis_guard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
